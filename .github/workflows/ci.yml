name: Build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/controls/package-lock.json
      - run: npm --prefix apps/controls ci
      - run: npm --prefix apps/controls run check
      - run: npm --prefix apps/controls run build
      - run: swift build --jobs 2
      - run: swift test --jobs 2
      - name: Check scripts and publication surface
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts
          python3 scripts/audit-public-tree.py
          git diff --check
